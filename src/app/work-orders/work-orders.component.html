<nav class="navbar mb-2">
    <a class="navbar-brand fw-bold fs-2 text-dark">Ordini</a>
  
    <form class="d-flex search" role="search">
        <input class="form-control me-2" id="nav-search" type="search" placeholder="Search" aria-label="Search">
        <button  class="btn btn-outline-secondary d-flex align-items-center search-btn">
            <i class="lni lni-search-text"></i>
        </button>
    </form>
    
    <button  class="btn btn-success d-flex align-items-center add-request-btn">
        <i class="lni lni-plus"></i>
        <span>Ordine</span>
    </button>
</nav>


<div class="table-responsive">
    
  <table mat-table [dataSource]="repairRequests" class="mat-elevation-z8">
    
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Titolo</th>
      <td mat-cell *matCellDef="let element">{{element.title}}</td>
    </ng-container>
  
    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef>Priorità</th>
      <td mat-cell *matCellDef="let element">
        <span class="dot" [class]='element.priority == 1 ? "bg-danger" : element.priority == 2 ? "bg-warning" : "bg-success"'></span>
        {{element.priority == 1 ? "High" : element.priority == 2 ? "Mid" : "Low"}}
      </td>
    </ng-container>
  
    <ng-container matColumnDef="request_id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let element">#{{element.request_id}}</td>
    </ng-container>
  
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Descrizione</th>
      <td mat-cell *matCellDef="let element">{{element.description}}...</td>
    </ng-container>
    
    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef>Indirizzo</th>
      <td mat-cell *matCellDef="let element">{{element.address}}</td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="columndefs"></tr>
    <tr
        mat-row
        *matRowDef="let row; let i = index; columns: columndefs;"
        (click)="open(i)"
    ></tr>
  </table>

</div>
