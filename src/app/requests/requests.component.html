  <table mat-table [dataSource]="repairRequests" class="mat-elevation-z8">
    <!-- Position Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Titolo</th>
      <td mat-cell *matCellDef="let element">{{element.title}}</td>
    </ng-container>
  
    <!-- Name Column -->
    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef>Priorità</th>
      <td mat-cell *matCellDef="let element">
        <span class="dot" [class]='element.priority == 1 ? "bg-danger" : element.priority == 2 ? "bg-warning" : "bg-success"'></span>
          {{element.priority == 1 ? "High" : element.priority == 2 ? "Middle" : "Low"}}
      </td>
    </ng-container>
  
    <!-- Weight Column -->
    <ng-container matColumnDef="request_id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let element">#{{element.request_id}}</td>
    </ng-container>
  
    <!-- Symbol Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Descrizione</th>
      <td mat-cell *matCellDef="let element">{{element.description}}</td>
    </ng-container>
    <!-- Symbol Column -->
    <ng-container matColumnDef="address">
      <th mat-header-cell *matHeaderCellDef>Indirizzo</th>
      <td mat-cell *matCellDef="let element">{{element.address}}</td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="columndefs"></tr>
    <tr
        mat-row
        *matRowDef="let row; columns: columndefs;"
        (click)="open()"
    ></tr>
  </table>
   
</div>
